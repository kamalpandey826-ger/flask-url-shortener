<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
</head>
<body>

<h1>Admin Login</h1>

<form method="POST">
    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        name="password"
        required
        autocomplete="current-password"
    >
    <button type="submit">Login</button>
</form>

</body>
</html>
