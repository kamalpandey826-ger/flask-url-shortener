<!DOCTYPE html>
<html>

<head>

<title>Python Link Shortener</title>

<style>

body {
    font-family: Arial;
    background: #f4f4f4;
    text-align: center;
    padding-top: 100px;
}

.container {
    background: white;
    width: 600px;
    margin: auto;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0px 5px 20px #ccc;
}

input {
    width: 70%;
    padding: 12px;
}

button {
    padding: 12px 20px;
    cursor: pointer;
}

.short-link {
    margin-top: 25px;
    font-size: 20px;
}

</style>

</head>

<body>

<div class="container">

<h1>🔗 Python Link Shortener</h1>

<p>Create short, trackable URLs.</p>

<form method="POST">

<input
type="url"
name="url"
placeholder="Paste your long URL here"
required
>

<button type="submit">
Shorten
</button>

</form>

{% if short_url %}

<div class="short-link">

<h3>Your Short Link</h3>

<a href="{{ short_url }}">
{{ short_url }}
</a>

</div>

{% endif %}

</div>

</body>
</html>
