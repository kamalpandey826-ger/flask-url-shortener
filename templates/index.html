<!DOCTYPE html>
<html>

<head>

<title>Python Link Shortener</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<h1>🔗 Python Link Shortener</h1>

<p>Create short, trackable URLs.</p>

<form method="POST">

<input
type="url"
name="url"
placeholder="Paste your long URL here"
required
>

<button type="submit">
Shorten
</button>

</form>

{% if short_url %}

<div class="short-link">

<h3>Your Short Link</h3>

<a href="{{ short_url }}">
{{ short_url }}
</a>

</div>

{% endif %}

</div>

</body>
</html>
